<html lang="fr">
<head>

  <style>
    :root{--ink:#212944;--sub:#69738c;--bg:#f7f8fe;--white:#fff;--blue:#4167e7;--blue-dark:#3151bf;--mint:#1b986b;--mint-bg:#e8f8ef;--red:#d6415c;--red-bg:#fff0f2;--orange:#ffb84d;--line:#e8eaf4;--shadow:0 16px 44px rgba(52,70,140,.09)}
    *{box-sizing:border-box}html{min-height:100%;-webkit-tap-highlight-color:transparent}body{margin:0;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 14% -6%,#e6eaff 0,transparent 34%),radial-gradient(circle at 100% 62%,#e8f9f4 0,transparent 36%),var(--bg);min-height:100svh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #f6b24e;outline-offset:3px}button:disabled{opacity:.48;cursor:default}.shell{width:min(100%,520px);min-height:100svh;margin:0 auto;padding:env(safe-area-inset-top) 18px calc(28px + env(safe-area-inset-bottom));position:relative}.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 4px 19px;gap:12px}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}.brand-mark{height:42px;width:42px;border-radius:15px;background:var(--blue);color:white;display:grid;place-items:center;font-size:22px;font-weight:900;box-shadow:0 7px 14px rgba(65,103,231,.18);transform:rotate(-7deg)}.brand-name{font-size:24px;font-weight:900;letter-spacing:-1.2px}.brand-name span{color:var(--blue)}.top-note{font-size:12px;color:var(--sub);font-weight:800;letter-spacing:.05em;text-transform:uppercase}.screen{animation:appear .22s ease both}@keyframes appear{from{opacity:.3;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}.hero{background:linear-gradient(145deg,#456beb 0%,#687fed 100%);border-radius:28px;padding:24px 24px 26px;color:#fff;box-shadow:0 17px 36px rgba(65,103,231,.17);position:relative;overflow:hidden;margin-bottom:23px}.hero:before,.hero:after{content:"";position:absolute;border:1px solid #ffffff42;border-radius:50%;width:165px;height:165px;right:-50px;top:-54px}.hero:after{width:100px;height:100px;top:auto;bottom:-52px;right:67px;background:#ffffff12}.hero-kicker{font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:.12em;opacity:.88}.hero h1{font-size:clamp(28px,7vw,36px);line-height:1.13;letter-spacing:-1.5px;margin:12px 0 10px;max-width:300px}.hero p{margin:0;line-height:1.5;font-size:15px;color:#eef1ff;max-width:280px}.hero-stars{position:absolute;right:20px;bottom:20px;color:#ffe69c;font-size:41px;transform:rotate(11deg);filter:drop-shadow(0 7px 6px #1f349738)}.choose-title{font-size:18px;font-weight:900;letter-spacing:-.4px;margin:6px 0 13px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e9edfb;padding:5px;border-radius:17px;gap:5px;margin-bottom:18px}.tab{border:0;background:transparent;color:#65708e;font-size:15px;font-weight:850;border-radius:12px;padding:14px 7px;white-space:nowrap}.tab.active{background:#fff;color:var(--blue-dark);box-shadow:0 4px 12px #252f6620}.level-list{display:grid;gap:11px}.level{display:flex;text-align:left;align-items:center;gap:14px;width:100%;border:1.5px solid #ebedf6;border-radius:21px;background:var(--white);padding:15px 16px;box-shadow:0 5px 17px rgba(48,62,121,.045);transition:transform .1s,border-color .1s}.level:active{transform:scale(.985);border-color:var(--blue)}.level-symbol{width:55px;height:55px;flex:0 0 55px;display:grid;place-items:center;border-radius:17px;color:var(--blue);background:#eef1ff;font-size:25px;font-weight:900}.level:nth-child(2) .level-symbol{color:#bc6a13;background:#fff5e5}.level:nth-child(3) .level-symbol{color:#128b76;background:#e6f7f2}.level:nth-child(4) .level-symbol{color:#a954b8;background:#f6eafb}.level-copy{flex:1;min-width:0}.level-name{font-size:17px;display:block;font-weight:900;letter-spacing:-.3px}.level-desc{font-size:13px;color:var(--sub);display:block;line-height:1.4;margin-top:3px}.level-arrow{color:#b2bad0;font-size:28px;font-weight:500}.footer-hint{text-align:center;color:#818aa1;font-size:12px;margin:23px 0 0;line-height:1.5}.go-back{border:0;background:white;color:var(--blue-dark);border-radius:12px;width:43px;height:43px;font-size:26px;font-weight:600;box-shadow:0 4px 13px #45598b16;display:grid;place-items:center}.game-top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:13px 0 15px}.game-top-title{text-align:center;flex:1}.game-top-title strong{font-size:16px;display:block}.game-top-title small{font-size:13px;color:var(--sub);display:block;margin-top:3px}.top-spacer{width:43px}.progress-heading{display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:13px;color:var(--sub);font-weight:800;margin:0 1px 10px}.progress-heading strong{color:var(--ink)}.progress-dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:23px}.dot{height:9px;background:#e3e7f4;border-radius:20px}.dot.done{background:#89d9ae}.dot.missed{background:#ffa1b0}.dot.current{background:var(--blue)}.question-card{background:white;border:1px solid #eef0f8;border-radius:29px;padding:18px 14px 17px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}.question-tag{color:#6c77a0;font-size:12px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.equation{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,23px);font-variant-numeric:tabular-nums;white-space:nowrap;margin:13px 0 15px;font-size:clamp(36px,11vw,57px);letter-spacing:-2px;font-weight:900}.operator{color:var(--blue);font-size:.76em}.eq-sign{color:#8790a8;font-size:.8em}.answer-space{width:93px;height:65px;border:3px solid #d5defc;border-radius:20px;background:#f5f7ff;color:var(--blue);display:grid;place-items:center;letter-spacing:0;position:relative;font-size:clamp(35px,9vw,49px)}.answer-space.empty:after{content:"?";color:#b2c2fa;font-size:43px}.answer-space.has-value{border-color:var(--blue)}.answer-space.good{background:var(--mint-bg);color:var(--mint);border-color:#7bd6a6}.answer-space.bad{background:var(--red-bg);color:var(--red);border-color:#ffa3b1}.prompt{margin:0;color:var(--sub);font-size:13px;min-height:20px;font-weight:650}.feedback{min-height:61px;margin-top:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;border-radius:18px;padding:10px 12px}.feedback.idle{background:#f4f6fc;color:#8992a8}.feedback.good{color:var(--mint);background:var(--mint-bg)}.feedback.bad{color:var(--red);background:var(--red-bg)}.feedback-title{font-weight:950;font-size:20px;letter-spacing:.04em}.feedback-sub{font-size:13px;font-weight:700;line-height:1.35;text-align:center}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 2px 0}.key{height:clamp(52px,7.1vh,64px);font-size:27px;font-weight:900;border:1.5px solid #e8ebf5;background:#fff;color:var(--ink);border-radius:18px;box-shadow:0 4px 0 #e3e8f4;touch-action:manipulation}.key:active{transform:translateY(3px);box-shadow:0 1px 0 #e3e8f4}.key.action{font-size:22px;color:var(--blue);background:#eef1ff}.primary{width:100%;display:flex;justify-content:center;align-items:center;gap:8px;background:var(--blue);color:white;border:0;border-radius:18px;padding:13px 16px;min-height:55px;font-size:18px;font-weight:900;box-shadow:0 7px 0 #2947b4;touch-action:manipulation}.primary:active:not(:disabled){transform:translateY(4px);box-shadow:0 3px 0 #2947b4}.primary:disabled{box-shadow:none}.action-area{margin:14px 2px 0}.secondary{width:100%;border:2px solid #dce4ff;background:white;color:var(--blue-dark);border-radius:17px;padding:15px;font-size:16px;font-weight:850}.mini-tip{text-align:center;color:#7d869d;font-size:12px;line-height:1.5;margin:12px 6px 0}.summary-hero{text-align:center;padding:27px 15px 25px;background:linear-gradient(155deg,#4167e7,#7387ef);border-radius:29px;box-shadow:0 12px 35px #4167e733;color:white;position:relative;overflow:hidden}.summary-hero:before{content:"✦";position:absolute;font-size:88px;top:-22px;right:6px;color:#ffffff24}.summary-trophy{font-size:53px;display:block;margin:1px 0 8px}.summary-hero h1{font-size:28px;line-height:1.15;margin:8px 0 10px;letter-spacing:-1px}.summary-hero p{margin:0 auto;line-height:1.5;max-width:330px;color:#eef1ff;font-size:14px}.score-line{display:flex;justify-content:center;align-items:baseline;margin:13px 0;gap:4px}.score-line strong{font-size:62px;line-height:1;font-weight:950;letter-spacing:-2px}.score-line span{font-size:23px;font-weight:700;opacity:.8}.summary-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0 19px}.stat{background:white;border:1px solid var(--line);border-radius:17px;text-align:center;padding:13px 7px}.stat strong{font-size:24px;display:block;margin-bottom:4px}.stat small{font-size:11px;line-height:1.25;font-weight:800;color:var(--sub);display:block}.stat:first-child strong{color:var(--mint)}.stat:nth-child(2) strong{color:#d79324}.stat:last-child strong{color:var(--red)}.results-head{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:17px;margin-bottom:10px}.results-list{display:grid;gap:7px;margin-bottom:19px}.result-row{display:flex;gap:9px;justify-content:space-between;align-items:center;background:white;border:1px solid var(--line);border-radius:14px;padding:12px 14px}.result-number{font-size:11px;font-weight:900;color:var(--sub);min-width:24px}.result-calc{flex:1;font-size:17px;font-weight:850;font-variant-numeric:tabular-nums}.result-tag{font-size:11px;font-weight:850;text-align:right}.result-tag.first{color:var(--mint)}.result-tag.second{color:#b47d20}.result-tag.missed{color:var(--red)}.summary-actions{display:grid;gap:12px;padding-bottom:14px}.no-scroll{overflow:hidden}@media(max-width:360px){.shell{padding-left:12px;padding-right:12px}.hero{padding:21px}.level{padding:12px}.equation{gap:9px;font-size:37px}.answer-space{width:78px;height:70px}.key{height:55px}.question-card{padding:22px 10px 17px}}@media(min-width:540px){.shell{padding-left:24px;padding-right:24px}.hero{margin-top:5px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<div id="app" class="shell"></div>
<script src="../shared/o-universe.js"></script>
<script>
(() => {
'use strict';
const app = document.getElementById('app');
const config = {
 add:[
  {name:'Niveau 1',desc:'Deux nombres à 1 chiffre',sample:'4 + 3'},
  {name:'Niveau 2',desc:'Entre 11 et 39 + un chiffre',sample:'24 + 7'},
  {name:'Niveau 3',desc:'Deux nombres à 2 chiffres, sans retenue',sample:'24 + 35'},
  {name:'Niveau 4',desc:'Deux nombres à 2 chiffres, avec retenue',sample:'37 + 25'}
 ],
 sub:[
  {name:'Niveau 1',desc:'Deux nombres à 1 chiffre',sample:'9 − 4'},
  {name:'Niveau 2',desc:'Entre 11 et 39 − un chiffre',sample:'24 − 7'},
  {name:'Niveau 3',desc:'Deux nombres à 2 chiffres, sans emprunt',sample:'58 − 23'}
 ]
};
let screen='home',tab='add',mode='add',level=0,questions=[],index=0,typed='',attempts=[],feedback='idle',runningTimer=null;
let lastSets={};try{lastSets=JSON.parse(localStorage.getItem((window.OUniverse&&window.OUniverse.storageKey('calculo_recent_sets'))||'calculo_recent_sets')||'{}')||{}}catch(e){}
const glyph={add:'+',sub:'−'};
const fmt=q=>`${q.a} ${glyph[q.mode]} ${q.b}`;
const h=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function buildPool(m,l){
 const out=[];
 const add=(a,b)=>out.push({a,b,answer:m==='add'?a+b:a-b,mode:m});
 if(m==='add'){
  if(l===0){for(let a=1;a<=9;a++)for(let b=a;b<=9;b++)add(a,b)}
  if(l===1){for(let a=11;a<=39;a++)for(let b=1;b<=9;b++)add(a,b)}
  if(l===2||l===3){for(let a=10;a<=89;a++)for(let b=a;b<=89;b++){const sum=a+b,carry=(a%10+b%10)>=10;if(sum<100 && carry===(l===3))add(a,b)}}
 } else {
  if(l===0){for(let a=1;a<=9;a++)for(let b=1;b<=a;b++)add(a,b)}
  if(l===1){for(let a=11;a<=39;a++)for(let b=1;b<=9;b++)add(a,b)}
  if(l===2){for(let a=10;a<=99;a++)for(let b=10;b<=a;b++)if(a%10>=b%10)add(a,b)}
 }
 return out;
}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function generate(m,l){
 const key=`${m}${l}`,pool=buildPool(m,l),prior=new Set(lastSets[key]||[]);
 const fresh=shuffle(pool.filter(q=>!prior.has(`${q.a}:${q.b}`)));
 const rest=shuffle(pool.filter(q=>prior.has(`${q.a}:${q.b}`)));
 const selected=fresh.concat(rest).slice(0,10).map(q=>({...q}));
 selected.forEach(q=>{if(m==='add' && (l===0||l>=2) && Math.random()<.5){[q.a,q.b]=[q.b,q.a]}});
 lastSets[key]=selected.map(q=>m==='add' && l!==1?`${Math.min(q.a,q.b)}:${Math.max(q.a,q.b)}`:`${q.a}:${q.b}`);
 try{localStorage.setItem((window.OUniverse&&window.OUniverse.storageKey('calculo_recent_sets'))||'calculo_recent_sets',JSON.stringify(lastSets))}catch(e){}
 return selected;
}
function header(){return `<header class="topbar"><div class="brand" aria-label="CalculO"><div class="brand-mark">+</div><div class="brand-name">Calcul<span>O!</span></div></div><span class="top-note">Spécial CP</span></header>`}
function render(){app.innerHTML=(screen==='home'?header():'')+(screen==='home'?home():screen==='game'?game():summary());bind();}
function home(){const arr=config[tab];return `<main class="screen"><section class="hero"><div class="hero-kicker">Apprendre en s'amusant</div><h1>Prêt pour un défi de calcul ?</h1><p>10 petits calculs, deux chances pour réussir, et plein de progrès !</p><div class="hero-stars" aria-hidden="true">✦</div></section><h2 class="choose-title">Choisis ton entraînement</h2><div class="tabs" role="tablist" aria-label="Type de calcul"><button role="tab" aria-selected="${tab==='add'}" class="tab ${tab==='add'?'active':''}" data-tab="add">➕ Additions</button><button role="tab" aria-selected="${tab==='sub'}" class="tab ${tab==='sub'?'active':''}" data-tab="sub">➖ Soustractions</button></div><div class="level-list">${arr.map((c,i)=>`<button type="button" class="level" data-level="${i}" aria-label="${h(c.name)}, ${h(c.desc)}"><span class="level-symbol">${i+1}</span><span class="level-copy"><span class="level-name">${h(c.name)}</span><span class="level-desc">${h(c.desc)}<span style="display:block;color:#9aa2b6;margin-top:2px">Exemple : ${h(c.sample)}</span></span></span><span class="level-arrow" aria-hidden="true">›</span></button>`).join('')}</div><p class="footer-hint">À chaque partie, 10 nouveaux calculs à ton rythme. ✨</p></main>`}
function game(){
 const q=questions[index],a=attempts[index],isResult=feedback==='good'||feedback==='missed',error=feedback==='bad'||feedback==='missed';
 const dots=questions.map((_,i)=>`<span class="dot ${i<index?(attempts[i].success?'done':'missed'):i===index?'current':''}"></span>`).join('');
 const message=feedback==='good'?`<div class="feedback good" role="status" aria-live="polite"><div class="feedback-title">✓ CORRECT</div><div class="feedback-sub">${a.tries.length===1?'Excellent ! Du premier coup !':'Bien joué, tu as trouvé !'}</div></div>`:feedback==='bad'?`<div class="feedback bad" role="status" aria-live="assertive"><div class="feedback-title">✕ ERREUR</div><div class="feedback-sub">Essaie encore, tu as une deuxième chance !</div></div>`:feedback==='missed'?`<div class="feedback bad" role="status" aria-live="assertive"><div class="feedback-title">✕ ERREUR</div><div class="feedback-sub">La bonne réponse était <strong>${q.answer}</strong>. On continue !</div></div>`:`<div class="feedback idle" role="status" aria-live="polite"><div class="feedback-sub">${a.tries.length===1?'À toi de réessayer !':'Tape ta réponse sur le clavier'}</div></div>`;
 const keypad=`<div class="keypad" aria-label="Clavier numérique">${['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(k=>`<button type="button" class="key ${k==='C'||k==='⌫'?'action':''}" ${isResult?'disabled':''} data-key="${k}" aria-label="${k==='C'?'Tout effacer':k==='⌫'?'Effacer un chiffre':k}">${k}</button>`).join('')}</div>`;
 return `<main class="screen"><div class="game-top"><button class="go-back" data-action="back" type="button" aria-label="Retour aux niveaux">‹</button><div class="game-top-title"><strong>${mode==='add'?'Additions':'Soustractions'} · Niveau ${level+1}</strong><small>À ton rythme, sans chronomètre</small></div><div class="top-spacer"></div></div><div class="progress-heading"><span>Ta progression</span><strong>${index+1} / 10</strong></div><div class="progress-dots" aria-label="Calcul ${index+1} sur 10">${dots}</div><section class="question-card"><div class="question-tag">Combien ça fait ?</div><div class="equation" aria-label="${q.a} ${mode==='add'?'plus':'moins'} ${q.b} égale"><span>${q.a}</span><span class="operator">${glyph[mode]}</span><span>${q.b}</span><span class="eq-sign">=</span><span aria-label="Réponse ${typed||'vide'}" class="answer-space ${typed?'has-value':'empty'} ${feedback==='good'?'good':error?'bad':''}">${typed?h(typed):''}</span></div><p class="prompt">${a.tries.length===1&&!a.success?'Deuxième et dernier essai':'Prends le temps de bien réfléchir'}</p>${message}</section>${!isResult?keypad:''}<div class="action-area">${isResult?`<button type="button" class="primary" data-action="next">${index===9?'Voir mon bilan':'Calcul suivant'} <span aria-hidden="true">→</span></button>`:`<button type="button" class="primary" data-action="check" ${typed===''?'disabled':''}>Je valide ✓</button>`}</div><p class="mini-tip">${isResult?'Tu peux continuer quand tu veux.':feedback==='bad'?'Relis bien le calcul avant de répondre.':'Tu as droit à deux essais pour chaque calcul.'}</p></main>`;
}
function summary(){
 const successful=attempts.filter(x=>x.success).length,first=attempts.filter(x=>x.success&&x.tries.length===1).length,second=attempts.filter(x=>x.success&&x.tries.length===2).length,missed=10-successful;
 const subtitle=successful===10?'Tous les calculs sont réussis ! Tu peux être fier de ton travail.':successful>=7?'Tu progresses vraiment bien ! Continue à t’entraîner pour aller encore plus loin.':successful>=4?'Tu as fait de beaux efforts ! Refais une partie pour progresser encore.':'Bravo d’avoir terminé les 10 calculs ! Continue à t’exercer : chaque essai te fait progresser.';
 return `<main class="screen"><div class="game-top"><button class="go-back" data-action="home" aria-label="Retour à l'accueil">‹</button><div class="game-top-title"><strong>Mon bilan</strong><small>${mode==='add'?'Additions':'Soustractions'} · Niveau ${level+1}</small></div><div class="top-spacer"></div></div><section class="summary-hero"><span class="summary-trophy" aria-hidden="true">🏆</span><h1>Bravo, champion !</h1><div class="score-line"><strong>${successful}</strong><span>/ 10 réussis</span></div><p>${h(subtitle)}</p></section><div class="summary-stats"><div class="stat"><strong>${first}</strong><small>Du premier coup</small></div><div class="stat"><strong>${second}</strong><small>Au deuxième essai</small></div><div class="stat"><strong>${missed}</strong><small>À retravailler</small></div></div><div class="results-head">Tes 10 calculs <span aria-hidden="true">✍️</span></div><div class="results-list">${questions.map((q,i)=>{const a=attempts[i];return `<div class="result-row"><span class="result-number">${String(i+1).padStart(2,'0')}</span><span class="result-calc">${fmt(q)} = ${q.answer}</span><span class="result-tag ${!a.success?'missed':a.tries.length===1?'first':'second'}">${!a.success?'À revoir':a.tries.length===1?'✓ 1er essai':'✓ 2e essai'}</span></div>`}).join('')}</div><div class="summary-actions"><button class="primary" data-action="replay">🔁 Rejouer ce niveau</button><button class="secondary" data-action="home">Choisir un autre niveau</button></div></main>`;
}
function clearTimer(){if(runningTimer!==null){clearTimeout(runningTimer);runningTimer=null}}
function start(m,l){clearTimer();mode=m;level=l;questions=generate(m,l);index=0;typed='';feedback='idle';attempts=questions.map(()=>({tries:[],success:false}));screen='game';render();window.scrollTo({top:0,behavior:'instant'});}
function next(){clearTimer();if(index>=9){const score=attempts.filter(r=>r.success).length;const firstTry=attempts.filter(r=>r.success&&r.tries.length===1).length;const secondTry=attempts.filter(r=>r.success&&r.tries.length===2).length;const missed=10-score;if(window.OUniverse){window.OUniverse.recordSession({game:'calculo',levelKey:`${mode}_${level}`,levelName:`${mode==='add'?'Addition':'Soustraction'} · Niveau ${level+1}`,score,total:10,firstTry,secondTry,missed});}screen='summary'}else{index++;typed='';feedback='idle'}render();window.scrollTo({top:0,behavior:'instant'});}
function enter(k){if(screen!=='game'||feedback==='good'||feedback==='missed')return;if(feedback==='bad')feedback='idle';if(k==='C')typed='';else if(k==='⌫')typed=typed.slice(0,-1);else if(/^\d$/.test(k)&&typed.length<2)typed+=k;render();}
function check(){if(screen!=='game'||typed==='')return;const q=questions[index],a=attempts[index];if(a.tries.length>=2||a.success)return;a.tries.push(Number(typed));if(Number(typed)===q.answer){a.success=true;feedback='good';render();runningTimer=setTimeout(()=>next(),1650)}else if(a.tries.length>=2){feedback='missed';render();runningTimer=setTimeout(()=>next(),2600)}else{feedback='bad';typed='';render();}}
function bind(){app.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{tab=el.dataset.tab;render()}));app.querySelectorAll('[data-level]').forEach(el=>el.addEventListener('click',()=>start(tab,Number(el.dataset.level))));app.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('click',()=>enter(el.dataset.key)));app.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{switch(el.dataset.action){case 'check':check();break;case 'next':next();break;case 'back':case 'home':clearTimer();screen='home';render();break;case 'replay':start(mode,level);break;}}));}
window.addEventListener('keydown',e=>{if(screen!=='game'||e.altKey||e.ctrlKey||e.metaKey)return;if(/^\d$/.test(e.key)){e.preventDefault();enter(e.key)}else if(e.key==='Backspace'){e.preventDefault();enter('⌫')}else if(e.key==='Delete'){e.preventDefault();enter('C')}else if(e.key==='Enter'){e.preventDefault();if(feedback==='good'||feedback==='missed')next();else check()}});
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
