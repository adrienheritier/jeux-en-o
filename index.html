<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4b6ff2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Jeux en O!">
  <meta name="description" content="L'univers des jeux en O! : CalculO!, LecturO! et ProblémO! avec profils, résultats et coupes.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=1">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <title>L'univers des jeux en O!</title>
  <style>
    :root{--ink:#222b48;--sub:#6d7893;--blue:#4b6ff2;--blue2:#7892ff;--mint:#45b78d;--gold:#f6c24f;--red:#d85a6d;--bg:#f7f8fe;--white:#fff;--line:#e8edf8;--shadow:0 14px 36px rgba(55,74,140,.13)}
    *{box-sizing:border-box}html{-webkit-tap-highlight-color:transparent}body{margin:0;font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;min-height:100svh;color:var(--ink);background:radial-gradient(circle at 10% 2%,#e8eeff 0,transparent 34%),radial-gradient(circle at 95% 78%,#eaf9f3 0,transparent 29%),var(--bg)} button,input{font:inherit}button{cursor:pointer;border:none}a{text-decoration:none;color:inherit}
    .shell{width:min(100%,980px);margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom))}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.brand-badge{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;font-weight:900;font-size:24px;box-shadow:var(--shadow)}.brand h1{margin:0;font-size:30px;line-height:1}.brand p{margin:4px 0 0;color:var(--sub);font-size:14px}.top-actions{display:flex;gap:10px;flex-wrap:wrap}.pill-btn,.secondary-btn,.primary-btn{border-radius:999px;padding:12px 16px;font-weight:800}.pill-btn{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.secondary-btn{background:#eef2ff;color:#3753ba}.primary-btn{background:linear-gradient(145deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 10px 25px rgba(75,111,242,.28)}
    .hero{background:linear-gradient(145deg,#4c70f2,#7993ff);color:#fff;border-radius:32px;padding:26px 22px;position:relative;overflow:hidden;box-shadow:0 18px 45px rgba(75,111,242,.22)}.hero::after{content:"";position:absolute;width:190px;height:190px;right:-28px;top:-45px;border-radius:50%;background:rgba(255,255,255,.08)}.hero small{display:inline-block;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:800;letter-spacing:.3px}.hero h2{margin:12px 0 10px;font-size:30px;line-height:1.05}.hero p{margin:0;max-width:670px;font-size:16px;line-height:1.5;color:#eef3ff}.hero-grid{display:grid;grid-template-columns:1.4fr .9fr;gap:16px;align-items:end}.hero-side{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.hero-stat{background:rgba(255,255,255,.14);backdrop-filter:blur(2px);padding:14px;border-radius:22px}.hero-stat strong{display:block;font-size:28px;line-height:1.1}.hero-stat span{font-size:14px;color:#eef3ff}
    .section{margin-top:18px}.section h3{margin:0 0 12px;font-size:20px}.card{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}
    .empty{padding:28px}.empty-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.soft{color:var(--sub)} .chips{display:flex;gap:10px;flex-wrap:wrap}.chip{padding:7px 12px;border-radius:999px;background:#f2f5fe;color:#425584;font-weight:700;font-size:13px}
    .form{padding:22px}.field{margin-bottom:15px}.label{display:block;margin-bottom:8px;font-weight:800}.text-input{width:100%;border:1.5px solid var(--line);border-radius:18px;padding:14px 15px;background:#fbfcff;color:var(--ink)} .choice-row{display:flex;gap:10px;flex-wrap:wrap}.avatar-btn,.color-btn{border:1.5px solid var(--line);background:#fff;border-radius:18px}.avatar-btn{width:58px;height:58px;font-size:26px}.avatar-btn.active,.color-btn.active{outline:3px solid #cdd8ff;border-color:#8ea6ff}.color-btn{width:36px;height:36px;border-radius:999px}
    .stats-grid,.games-grid,.ach-grid{display:grid;gap:14px}.stats-grid{grid-template-columns:repeat(4,1fr)}.games-grid{grid-template-columns:repeat(3,1fr)}.ach-grid{grid-template-columns:repeat(2,1fr)}
    .stat-card{padding:18px}.stat-card strong{display:block;font-size:28px}.stat-card span{color:var(--sub);font-size:14px}
    .profile-card{padding:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.profile-main{display:flex;align-items:center;gap:14px}.avatar{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;color:#fff;font-size:34px;font-weight:900;box-shadow:0 12px 28px rgba(55,74,140,.17)}.profile-name{font-size:24px;font-weight:900}.profile-sub{color:var(--sub);margin-top:4px}
    .game-card{padding:18px;display:flex;flex-direction:column;gap:14px}.game-head{display:flex;gap:12px;align-items:center}.game-icon{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:900}.game-title{font-size:22px;font-weight:900}.game-meta{color:var(--sub);font-size:14px}.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:#f7f9ff;border-radius:18px;padding:10px 11px}.mini strong{display:block;font-size:19px}.mini span{font-size:13px;color:var(--sub)}.cupline{display:flex;gap:8px;flex-wrap:wrap}.cup{padding:7px 11px;border-radius:999px;background:#fff7e0;color:#896115;font-weight:800;font-size:13px}.game-actions{display:flex;gap:10px;margin-top:auto}
    .ach-card{padding:16px;display:flex;gap:12px;align-items:flex-start}.ach-icon{width:52px;height:52px;border-radius:16px;background:#f2f5ff;display:grid;place-items:center;font-size:24px}.ach-card.locked{opacity:.58}.ach-name{font-weight:900;margin:1px 0 4px}.ach-desc{font-size:14px;color:var(--sub);line-height:1.35}.ach-date{margin-top:6px;font-size:12px;color:#51705f;font-weight:700}
    .history{padding:16px}.session{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.session:first-child{border-top:none}.session-left{display:flex;gap:10px;align-items:flex-start}.session-badge{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:20px}.session small,.muted{color:var(--sub)}
    .overlay{position:fixed;inset:0;background:rgba(21,29,56,.42);display:grid;place-items:center;padding:16px;z-index:50}.dialog{width:min(100%,760px);max-height:88svh;overflow:auto;background:#fff;border-radius:28px;padding:18px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(35,44,82,.25)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.profiles-list{display:grid;gap:10px;margin-top:12px}.profile-item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:20px;padding:12px}.profile-item.active{background:#f4f7ff;border-color:#9fb4ff}.ghost-btn{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:800}.danger-btn{background:#fff1f4;color:#a93b4f;border-radius:14px;padding:10px 12px;font-weight:800}
    @media (max-width:900px){.hero-grid,.empty-grid,.games-grid,.stats-grid,.ach-grid{grid-template-columns:1fr}.hero-side{grid-template-columns:repeat(2,1fr)} }
    @media (max-width:620px){.brand h1{font-size:26px}.hero h2{font-size:27px}.profile-name{font-size:22px}.topbar{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions>*{flex:1}}
  </style>
</head>
<body>
  <div id="app" class="shell"></div>
  <script src="./shared/o-universe.js"></script>
  <script>
    (()=>{
      'use strict';
      const app=document.getElementById('app');
      let modalOpen=false;
      let avatar='🦊', color='#4b6ff2', draftName='';
      const AVATARS=['🦊','🐻','🐼','🐸','🐱','🐵','🐰','🦄'];
      const COLORS=['#4b6ff2','#45b78d','#f39b33','#df5d72','#7a61f5','#1fa5b9'];
      const gameOrder=['calculo','lecturo','problemo'];
      const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      function state(){ return { profiles: OUniverse.getProfiles(), active: OUniverse.getActiveProfile(), summary: OUniverse.getProfileSummary(), achievements: OUniverse.getAchievementsForProfile() }; }
      function cupLabel(n,total){ return `${n}/${total} coupes`; }
      function render(){
        const s=state();
        const active=s.active;
        app.innerHTML = topbar(active) + (!s.profiles.length ? onboarding() : dashboard(s)) + (modalOpen ? profileModal(s) : '');
        bind();
      }
      function topbar(active){ return `<header class="topbar"><div class="brand"><div class="brand-badge">O!</div><div><h1>L'univers des jeux en O!</h1><p>Trois jeux, un profil, des progrès visibles et des coupes à gagner.</p></div></div><div class="top-actions">${active?`<button class="pill-btn" data-action="open-profiles">${active.avatar} ${esc(active.name)}</button>`:''}${state().profiles.length?`<button class="secondary-btn" data-action="add-profile">+ Nouveau profil</button>`:''}</div></header>`; }
      function onboarding(){ return `<section class="hero hero-grid"><div><small>Nouvel univers</small><h2>Commence par créer un profil enfant</h2><p>Chaque profil garde ses propres résultats, ses coupes et ses succès. Les trois jeux utilisent ensuite automatiquement ce profil.</p></div><div class="hero-side"><div class="hero-stat"><strong>3</strong><span>jeux inclus</span></div><div class="hero-stat"><strong>13</strong><span>niveaux à réussir</span></div><div class="hero-stat"><strong>10</strong><span>questions par partie</span></div><div class="hero-stat"><strong>∞</strong><span>rejouable</span></div></div></section><section class="section card empty"><div class="empty-grid"><div><h3>Une charte douce et mignonne</h3><p class="soft">Couleurs douces, grands boutons, cartes arrondies et mise en page claire : tout est pensé pour un usage agréable sur téléphone ou tablette, sans surcharge visuelle.</p><div class="chips"><span class="chip">Profils</span><span class="chip">Historique</span><span class="chip">Succès</span><span class="chip">Coupes</span><span class="chip">Sauvegarde locale</span></div></div>${profileForm()}</div></section>`; }
      function dashboard(s){ const sum=s.summary; return `<section class="hero hero-grid"><div><small>Profil actif</small><h2>${s.active.avatar} ${esc(s.active.name)}</h2><p>Choisis un jeu, continue tes progrès et collectionne des coupes. Les résultats sont enregistrés automatiquement sur cet appareil.</p></div><div class="hero-side"><div class="hero-stat"><strong>${sum.totalGames}</strong><span>parties jouées</span></div><div class="hero-stat"><strong>${sum.successRate}%</strong><span>de réussite</span></div><div class="hero-stat"><strong>${sum.cups.total}</strong><span>coupes gagnées</span></div><div class="hero-stat"><strong>${sum.achievementsUnlocked}/${sum.achievementsTotal}</strong><span>succès débloqués</span></div></div></section>
        <section class="section card profile-card"><div class="profile-main"><div class="avatar" style="background:${esc(s.active.color)}">${s.active.avatar}</div><div><div class="profile-name">${esc(s.active.name)}</div><div class="profile-sub">Créé le ${OUniverse.prettyDate(s.active.createdAt)} · Sauvegarde locale sur l'appareil</div></div></div><div class="top-actions"><button class="secondary-btn" data-action="open-profiles">Gérer les profils</button></div></section>
        <section class="section stats-grid"><div class="card stat-card"><strong>${sum.totalQuestions}</strong><span>questions résolues</span></div><div class="card stat-card"><strong>${sum.totalFirst}</strong><span>réussies du 1er essai</span></div><div class="card stat-card"><strong>${sum.totalSecond}</strong><span>réussies du 2e essai</span></div><div class="card stat-card"><strong>${sum.totalMissed}</strong><span>à retravailler</span></div></section>
        <section class="section"><h3>Choisir un jeu</h3><div class="games-grid">${gameOrder.map(key=>gameCard(sum.appStats[key])).join('')}</div></section>
        <section class="section"><h3>Succès débloqués</h3><div class="ach-grid">${s.achievements.map(achievementCard).join('')}</div></section>
        <section class="section"><h3>Dernières parties</h3><div class="card history">${sum.recentSessions.length ? sum.recentSessions.map(sessionRow).join('') : `<p class="soft">Aucune partie jouée pour le moment.</p>`}</div></section>`; }
      function gameCard(g){ return `<article class="card game-card"><div class="game-head"><div class="game-icon" style="background:${g.color}">${g.icon}</div><div><div class="game-title">${g.name}</div><div class="game-meta">${g.sessions?`Dernier score max : ${g.best}/10 · Moyenne : ${g.average}/10`:'Pas encore joué'}</div></div></div><div class="mini-stats"><div class="mini"><strong>${g.sessions}</strong><span>parties</span></div><div class="mini"><strong>${g.cups}</strong><span>${cupLabel(g.cups,g.totalCups)}</span></div><div class="mini"><strong>${g.gold}</strong><span>coupes d'or</span></div></div><div class="cupline"><span class="cup">🥇 ${g.gold}</span><span class="cup">🥈 ${g.silver}</span><span class="cup">🥉 ${g.bronze}</span></div><div class="game-actions"><a class="primary-btn" href="${g.path}index.html">Jouer</a></div></article>`; }
      function achievementCard(a){ return `<article class="card ach-card ${a.unlocked?'':'locked'}"><div class="ach-icon">${a.icon}</div><div><div class="ach-name">${a.name}</div><div class="ach-desc">${a.desc}</div>${a.unlocked?`<div class="ach-date">Débloqué le ${OUniverse.prettyDate(a.unlockedAt)}</div>`:''}</div></article>`; }
      function sessionRow(s){ const cfg=OUniverse.GAMES[s.game]; const tier=s.score===10?'🥇':s.score===9?'🥈':s.score>=8?'🥉':'•'; return `<div class="session"><div class="session-left"><div class="session-badge" style="background:${cfg.color}">${cfg.icon}</div><div><div><strong>${cfg.name}</strong> · ${esc(s.levelName)}</div><small>${OUniverse.prettyDate(s.playedAt)} · ${s.firstTry} du 1er essai · ${s.secondTry} du 2e essai</small></div></div><div><strong>${tier} ${s.score}/${s.total}</strong></div></div>`; }
      function profileForm(){ return `<div class="card form"><div class="field"><label class="label">Prénom ou pseudo</label><input id="profile-name" class="text-input" maxlength="24" value="${esc(draftName)}" placeholder="Ex. Elio"></div><div class="field"><div class="label">Choisis un petit avatar</div><div class="choice-row">${AVATARS.map(a=>`<button type="button" class="avatar-btn ${a===avatar?'active':''}" data-avatar="${a}">${a}</button>`).join('')}</div></div><div class="field"><div class="label">Choisis une couleur</div><div class="choice-row">${COLORS.map(c=>`<button type="button" class="color-btn ${c===color?'active':''}" data-color="${c}" style="background:${c}"></button>`).join('')}</div></div><button class="primary-btn" data-action="create-profile">Créer le profil</button></div>`; }
      function profileModal(s){ return `<div class="overlay" data-action="close-profiles"><div class="dialog" onclick="event.stopPropagation()"><div class="dialog-head"><div><h3 style="margin:0">Profils</h3><div class="soft">Choisis le profil actif ou crée-en un nouveau.</div></div><button class="ghost-btn" data-action="close-profiles">Fermer</button></div><div class="profiles-list">${s.profiles.map(p=>`<div class="profile-item ${s.active&&s.active.id===p.id?'active':''}"><div class="profile-main"><div class="avatar" style="width:54px;height:54px;font-size:28px;background:${p.color}">${p.avatar}</div><div><div style="font-weight:900">${esc(p.name)}</div><div class="soft">${(OUniverse.getProfileSummary(p.id)||{totalGames:0,cups:{total:0}}).totalGames} parties · ${(OUniverse.getProfileSummary(p.id)||{cups:{total:0}}).cups.total} coupes</div></div></div><div class="top-actions"><button class="ghost-btn" data-action="switch-profile" data-id="${p.id}">Choisir</button>${s.profiles.length>1?`<button class="danger-btn" data-action="delete-profile" data-id="${p.id}">Supprimer</button>`:''}</div></div>`).join('')}</div><div style="margin-top:16px">${profileForm()}</div></div></div>`; }
      function bind(){
        app.querySelector('#profile-name')?.addEventListener('input', e => { draftName=e.target.value; });
        app.querySelectorAll('[data-avatar]').forEach(b=>b.addEventListener('click',()=>{avatar=b.dataset.avatar;render()}));
        app.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{color=b.dataset.color;render()}));
        app.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',e=>{
          const action=el.dataset.action;
          if(action==='create-profile'){ const input=app.querySelector('#profile-name'); const name=(input&&input.value||'').trim(); if(!name){ alert('Entre un prénom ou un pseudo.'); return; } OUniverse.createProfile({name,avatar,color}); draftName=''; modalOpen=false; render(); }
          if(action==='open-profiles'){ modalOpen=true; render(); }
          if(action==='close-profiles'){ modalOpen=false; render(); }
          if(action==='add-profile'){ modalOpen=true; render(); }
          if(action==='switch-profile'){ OUniverse.setActiveProfile(el.dataset.id); modalOpen=false; render(); }
          if(action==='delete-profile'){ const p=OUniverse.getProfiles().find(x=>x.id===el.dataset.id); if(p && confirm(`Supprimer le profil ${p.name} ?`)){ OUniverse.deleteProfile(p.id); render(); } }
        }));
      }
      if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
      window.addEventListener('jeuxo:update', render);
      render();
    })();
  </script>
</body>
</html>
