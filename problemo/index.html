function varsFor(type,lev,mode){let a,b,c=0,x=0,answer,stages=[],toolStart,toolGoal=null,toolLabel='';

    }else if(type==='compare'){

    }else if(type==='part'){

  if(type==='sub'||type==='missing'||type==='compare'||type==='part')stages=[a-b];

function chooseOptions(q,lev){const v=q.vars,ans=v.answer,limit=lev===0?10:lev===1?22:50;

  if(q.kind==='extra')candidates.push(ans+v.x,ans-v.x);

}
function toolMarkup(q){const v=q.vars;
  return `<div class="tool-wrap"><button class="tool-toggle" type="button" data-action="toggle-tool" aria-expanded="${openTool}" aria-controls="tool-panel"><span>🧮 ${openTool?'Masquer les jetons':'Je m’aide avec des jetons'}</span><span aria-hidden="true">${openTool?'−':'+'}</span></button>${openTool?`<div class="tool-panel" id="tool-panel"><div class="tool-title">Mes jetons à manipuler</div><p class="tool-hint">${html(TOOL_HINTS[q.kind])}</p><div class="counter-count"><span>Dans ma boîte</span><strong aria-live="polite">${toolCount}</strong></div><div class="counter-display" aria-label="${toolCount} jetons">${chips(toolCount)}</div><div class="tool-buttons"><button type="button" data-action="minus-token" aria-label="Retirer un jeton" ${toolCount===0?'disabled':''}><span>−</span> Enlever 1</button><button type="button" data-action="plus-token" aria-label="Ajouter un jeton" ${toolCount===50?'disabled':''}><span>+</span> Ajouter 1</button></div><div class="tool-footer"><span>${toolCount===v.toolStart?'Départ : aucun changement.':toolCount>v.toolStart?`Tu as ajouté ${toolCount-v.toolStart} jeton${toolCount-v.toolStart>1?'s':''}.`:`Tu as enlevé ${v.toolStart-toolCount} jeton${v.toolStart-toolCount>1?'s':''}.`}</span><button type="button" data-action="reset-token">Recommencer</button></div></div>`:''}</div>`;
}
function game(){const q=round[index],r=attempts[index],finished=feedback==='good'||feedback==='missed';
 const fb=feedback==='good'?`<div class="feedback good" role="status" aria-live="polite"><div class="feedback-title">✓ CORRECT</div><div class="feedback-sub">${r.tries.length===1?'Super, tu as trouvé !':'Bravo, tu as trouvé au deuxième essai !'}</div></div>`:feedback==='retry'?`<div class="feedback bad" role="status" aria-live="polite"><div class="feedback-title">✕ ERREUR</div><div class="feedback-sub">Relis le problème. Tu peux essayer encore une fois.</div></div>`:feedback==='missed'?`<div class="feedback bad" role="status" aria-live="polite"><div class="feedback-title">✕ ERREUR</div><div class="feedback-sub">La réponse était ${q.answer}. Tu vas apprendre avec la correction.</div></div>`:`<div class="feedback idle" role="status" aria-live="polite"><div class="feedback-sub">Lis, cherche et choisis une réponse.</div></div>`;
 return `<main class="screen"><div class="game-top"><button class="go-back" type="button" data-action="ask-exit" aria-label="Quitter la partie">‹</button><div class="game-top-title"><strong>Problèmes · ${html(LEVELS[level].name)}</strong><small>Réfléchis à ton rythme</small></div><span class="top-spacer"></span></div><div class="progress-heading"><span>Ta progression</span><strong>${index+1} / 10</strong></div><div class="progress-dots" aria-label="Problème ${index+1} sur 10">${progressDots()}</div><section class="question-card"><div class="problem-header"><span class="task-label">${MIX[q.kind]}</span><span class="story-emoji" aria-hidden="true">${q.emoji}</span></div><p class="passage">${html(q.passage)}</p><p class="question-line">${html(q.ask)}</p></section>${toolMarkup(q)}<div class="answer-heading">Quelle est la bonne réponse ?</div><div class="option-list" role="group" aria-label="Réponses possibles">${q.options.map((val,i)=>{
  const isWrong=r.tries.includes(val)&&val!==q.answer,correct=finished&&val===q.answer,sel=selected===val&&!finished;
  return `<button type="button" class="option ${isWrong?'wrong':''} ${correct?'correct':''} ${sel?'selected':''}" data-choice="${i}" aria-pressed="${sel}" ${finished||isWrong?'disabled':''}><span class="option-letter">${correct?'✓':isWrong?'×':i+1}</span><span class="answer-number">${val}</span></button>`}).join('')}</div>${fb}${finished?`<section class="reason"><span>💡 Comment trouver ?</span><p>${html(q.explain)}</p></section>`:''}<div class="action-area">${finished?`<button class="primary" type="button" data-action="next">${index===9?'Voir mon bilan':'Problème suivant'} <span aria-hidden="true">→</span></button>`:`<button class="primary" type="button" data-action="check" ${selected===null?'disabled':''}>Je valide ✓</button>`}</div><p class="mini-tip">${finished?'Continue quand tu es prêt.':feedback==='retry'?'Il reste une deuxième chance.':'Tu peux utiliser les jetons pour t’aider.'}</p></main>`;
}
function summary(){const first=attempts.filter(r=>r.success&&r.tries.length===1).length,second=attempts.filter(r=>r.success&&r.tries.length===2).length,missed=10-first-second,score=first+second;
 let msg=score===10?'Tous tes problèmes sont réussis ! Continue à chercher de nouvelles solutions.':score>=7?'Très bon travail ! Les prochains problèmes t’aideront à progresser encore.':score>=4?'Tu avances bien ! Relire le problème et utiliser les jetons peut t’aider.':'Tu as terminé les dix problèmes ! Chaque nouvel essai t’aide à mieux comprendre.';
 return `<main class="screen"><div class="game-top"><button class="go-back" type="button" data-action="home" aria-label="Retour à l’accueil">‹</button><div class="game-top-title"><strong>Mon bilan</strong><small>Problèmes · ${LEVELS[level].name}</small></div><span class="top-spacer"></span></div><section class="summary-hero"><span class="summary-trophy" aria-hidden="true">🏆</span><h1>Bravo, petit chercheur !</h1><div class="score-line"><strong>${score}</strong><span>/ 10 réussis</span></div><p>${msg}</p></section><div class="summary-stats"><div class="stat"><strong>${first}</strong><small>Du premier coup</small></div><div class="stat"><strong>${second}</strong><small>Au deuxième essai</small></div><div class="stat"><strong>${missed}</strong><small>À retravailler</small></div></div><h2 class="results-head">Mes dix problèmes 🧩</h2><div class="results-list">${round.map((q,i)=>{
 const r=attempts[i],isFirst=r.success&&r.tries.length===1,kind=!r.success?'missed':isFirst?'first':'second';const status=!r.success?'À revoir':isFirst?'✓ 1er essai':'✓ 2e essai';
 return `<div class="result-row"><span class="result-number">${String(i+1).padStart(2,'0')}</span><div class="result-copy"><span class="result-question">${q.emoji} ${html(q.ask)}</span><span class="result-answer">${html(q.explain)}</span></div><span class="result-tag ${kind}">${status}</span></div>`}).join('')}</div><div class="summary-actions"><button class="primary" type="button" data-action="replay">↻ Rejouer ce niveau</button><button class="secondary" type="button" data-action="home">Choisir un autre niveau</button></div></main>`;
}
function dialog(){return `<div class="overlay" role="presentation"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="exit-title"><span style="font-size:39px" aria-hidden="true">🧩</span><h2 id="exit-title">Quitter cette partie ?</h2><p>Tu n’as pas encore terminé les dix problèmes. Tu pourras recommencer plus tard.</p><div class="dialog-buttons"><button class="secondary" data-action="cancel-exit">Je continue</button><button class="primary" data-action="exit">Je quitte</button></div></section></div>`}
function render(){app.innerHTML=(screen==='home'?brand()+home():screen==='game'?game():summary())+(askExit?dialog():'');bind()}
function goTop(){window.scrollTo({top:0,behavior:'instant'})}
function resetTool(){openTool=false;toolCount=round[index].vars.toolStart;toolActions=0}
function start(lev){level=lev;round=makeRound(lev);attempts=round.map(()=>({tries:[],success:false}));index=0;selected=null;feedback='idle';askExit=false;screen='game';resetTool();render();goTop()}
function choose(i){if(screen!=='game'||askExit||['good','missed'].includes(feedback))return;const val=round[index].options[i];if(val===undefined||attempts[index].tries.includes(val))return;selected=val;render()}
function check(){if(screen!=='game'||selected===null||askExit||['good','missed'].includes(feedback))return;const res=attempts[index],q=round[index];res.tries.push(selected);if(selected===q.answer){res.success=true;feedback='good'}else{feedback=res.tries.length>=2?'missed':'retry'}selected=null;render()}
function next(){if(screen!=='game'||!['good','missed'].includes(feedback))return;if(index===9){screen='summary';const score=attempts.filter(r=>r.success).length;const firstTry=attempts.filter(r=>r.success&&r.tries.length===1).length;const secondTry=attempts.filter(r=>r.success&&r.tries.length===2).length;const missed=10-score;const state=history.levels[level];state.games++;state.best=Math.max(state.best??0,score);save();if(window.OUniverse){window.OUniverse.recordSession({game:'problemo',levelKey:`level_${level}`,levelName:['Facile','Moyen','Avancé'][level],score,total:10,firstTry,secondTry,missed});}}else{index++;selected=null;feedback='idle';resetTool()}render();goTop()}
function goHome(){screen='home';askExit=false;render();goTop()}
function moveTokens(n){const val=toolCount+n;if(val<0||val>50)return;toolCount=val;toolActions++;render()}
function bind(){app.querySelectorAll('[data-level]').forEach(el=>el.addEventListener('click',()=>start(Number(el.dataset.level))));
 app.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>choose(Number(el.dataset.choice))));
 app.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{switch(el.dataset.action){
  case 'check':check();break;case 'next':next();break;case 'replay':start(level);break;case 'home':goHome();break;case 'ask-exit':askExit=true;render();break;case 'cancel-exit':askExit=false;render();break;case 'exit':goHome();break;
  case 'toggle-tool':openTool=!openTool;render();break;case 'plus-token':moveTokens(1);break;case 'minus-token':moveTokens(-1);break;case 'reset-token':toolCount=round[index].vars.toolStart;toolActions=0;render();break;
 } }));}
window.addEventListener('keydown',e=>{if(askExit){if(e.key==='Escape'){askExit=false;render()}return}if(screen!=='game'||e.ctrlKey||e.altKey||e.metaKey)return;
 if(/^[123]$/.test(e.key)){e.preventDefault();choose(Number(e.key)-1)}else if(e.key==='Enter'){e.preventDefault();if(['good','missed'].includes(feedback))next();else check()}});
render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
})();

</script>
</body>
</html>
